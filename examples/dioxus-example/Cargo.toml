[package]
name = "dioxus-blec-example"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone, like the other examples: not a member of the repo workspace.
[workspace]

[dependencies]
dioxus-blec = { version = "0.20.0", path = "../../crates/dioxus-blec", features = ["android-webview"] }
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "97adf7915e1adfef4e2da436c9bd0b6add0dfa39", version = "0.8.0-alpha.3" }
tracing = "0.1"
uuid = "1"

[features]
default = []
# Replaces the platform backend with blec's in-process mock, so the app can be
# run on a machine without a bluetooth adapter.
mock = ["dioxus-blec/mock"]
